name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  verify:
    name: Verify (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l cmd internal tests)
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Check module consistency
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: Vet source
        run: go vet ./...

      - name: Obtain checksum-pinned native Xray
        run: bash scripts/ci/install-xray.sh "$RUNNER_TEMP/xray"

      - name: Run tests with the race detector
        env:
          PAPILIO_TEST_XRAY: ${{ runner.temp }}/xray/xray
        run: go test -race -count=1 ./...

      - name: Fuzz native API configuration preparation
        run: go test ./internal/cores/xray -run='^$' -fuzz='^FuzzAPIOverlay$' -fuzztime=5s -parallel=2

      - name: Build native executable
        run: go build -trimpath -o bin/node ./cmd/node

      - name: Verify executable metadata
        run: |
          ./bin/node help
          ./bin/node version
          ./bin/node version --json > "$RUNNER_TEMP/node-version.json"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          info = json.loads((Path(os.environ['RUNNER_TEMP']) / 'node-version.json').read_text())
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert info['revision'] == revision, info
          assert info['modified'] is False, info
          assert info['os'] == 'linux', info
          assert info['arch'] in {'amd64', 'arm64'}, info
          assert info['go_version'] == 'go1.27.3', info
          PY

  vulnerabilities:
    name: Check reachable vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      - name: Install pinned vulnerability scanner
        run: GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Check reachable vulnerabilities
        run: '"$RUNNER_TEMP/bin/govulncheck" ./...'
